name: Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Shared security scan — runs before any release logic
  # Blocks the workflow if anything suspicious is detected in the repository.
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: "Guard 1 — PHP webshell signatures"
        run: |
          set -euo pipefail
          # Catches eval-obfuscation chains, user-input-to-exec calls, and error suppression
          # used by virtually every PHP webshell in the wild.
          PATTERN='eval\(base64_decode\(|eval\(gzinflate\(|eval\(gzuncompress\(|eval\(gzdeflate\(|eval\(str_rot13\('
          PATTERN="${PATTERN}|preg_replace\([^,]*/e[^,]*,"
          PATTERN="${PATTERN}|assert\(\$_(GET|POST|REQUEST|COOKIE|SERVER)"
          PATTERN="${PATTERN}|shell_exec\(\$_(GET|POST|REQUEST|COOKIE|SERVER)"
          PATTERN="${PATTERN}|system\(\$_(GET|POST|REQUEST|COOKIE|SERVER)"
          PATTERN="${PATTERN}|passthru\(\$_(GET|POST|REQUEST|COOKIE|SERVER)"
          PATTERN="${PATTERN}|exec\(\$_(GET|POST|REQUEST|COOKIE|SERVER)"
          PATTERN="${PATTERN}|popen\(\$_(GET|POST|REQUEST|COOKIE|SERVER)"
          PATTERN="${PATTERN}|proc_open\(\$_(GET|POST|REQUEST|COOKIE|SERVER)"
          PATTERN="${PATTERN}|error_reporting\(0\)"
          if git grep -nE "$PATTERN" -- '*.php' 2>/dev/null; then
            echo "::error::BLOCKED — PHP webshell signature detected (see matches above)."
            exit 1
          fi
          echo "PHP webshell check passed."

      - name: "Guard 2 — Suspicious PHP filenames"
        run: |
          set -euo pipefail
          # Block PHP files with hex/hash-style names (e.g. d1337.php, a3f9bc12.php)
          # — a common pattern for dropped webshells.
          if git ls-files | grep -qE '(^|/)[a-f0-9]{4,}\.php$'; then
            echo "::error::BLOCKED — PHP file with hex/hash name detected:"
            git ls-files | grep -E '(^|/)[a-f0-9]{4,}\.php$'
            exit 1
          fi
          # Block PHP files inside upload / temp / cache directories
          if git ls-files | grep -qiE '/(upload|uploads|tmp|temp|cache)/[^/]+\.php$'; then
            echo "::error::BLOCKED — PHP file inside upload/temp/cache directory:"
            git ls-files | grep -iE '/(upload|uploads|tmp|temp|cache)/[^/]+\.php$'
            exit 1
          fi
          echo "PHP filename check passed."

      - name: "Guard 3 — Dangerous shell patterns"
        run: |
          set -euo pipefail
          # Block curl/wget piped directly to a shell interpreter in .sh files.
          if git grep -nE 'curl[^|#]*\|(bash|sh)|wget[^|#]*\|(bash|sh)' -- '*.sh' 2>/dev/null; then
            echo "::error::BLOCKED — curl/wget pipe-to-shell detected in shell scripts."
            exit 1
          fi
          echo "Shell pattern check passed."

      - name: "Guard 4 — Hardcoded secrets and credentials"
        run: |
          set -euo pipefail
          # Detect common secret formats: PEM private keys, GitHub tokens, AWS access keys.
          PATTERN='-----BEGIN (RSA|EC|OPENSSH|PGP|DSA) PRIVATE KEY'
          PATTERN="${PATTERN}|ghp_[A-Za-z0-9]{36}"
          PATTERN="${PATTERN}|ghs_[A-Za-z0-9]{36}"
          PATTERN="${PATTERN}|github_pat_[A-Za-z0-9_]{82}"
          PATTERN="${PATTERN}|AKIA[0-9A-Z]{16}"
          if git grep -nE "$PATTERN" 2>/dev/null; then
            echo "::error::BLOCKED — Possible secret or private key committed (see matches above)."
            exit 1
          fi
          echo "Secrets check passed."

      - name: "Guard 5 — Workflow modification notice"
        run: |
          set -euo pipefail
          # Not a blocker, but emit a visible warning when a workflow file is changed
          # so it gets extra attention during review.
          PARENT=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -n "$PARENT" ] && git diff --name-only "$PARENT" HEAD | grep -qE '^\.github/workflows/'; then
            echo "::warning::A GitHub Actions workflow file was modified in this push — review it carefully before merging."
            git diff --name-only "$PARENT" HEAD | grep -E '^\.github/workflows/'
          fi
          echo "Workflow change check done."

  # ─────────────────────────────────────────────
  # Stable release — triggered by push to main
  # ─────────────────────────────────────────────
  release-stable:
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Read version from composer.json or VERSION
        id: read
        run: |
          set -euo pipefail
          version=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"] ?? "";')
          if [ -z "$version" ] && [ -f VERSION ]; then
            version=$(cat VERSION | tr -d '[:space:]')
          fi
          # Strict semver X.Y.Z — rejects any string containing shell metacharacters
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid or missing version: '$version'. Must be semver (e.g. 1.2.3)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "$VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$VERSION"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$VERSION" \
            --generate-notes

  # ─────────────────────────────────────────────
  # Beta pre-release — triggered by push to develop
  # Tag format: {version}-beta.{run_number}
  # e.g. 0.3.93-beta.42
  # ─────────────────────────────────────────────
  release-beta:
    needs: security-scan
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Read base version from composer.json or VERSION
        id: read
        run: |
          set -euo pipefail
          version=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"] ?? "";')
          if [ -z "$version" ] && [ -f VERSION ]; then
            version=$(cat VERSION | tr -d '[:space:]')
          fi
          # Strict semver X.Y.Z — rejects any string containing shell metacharacters
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid or missing version: '$version'. Must be semver (e.g. 1.2.3)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build beta tag
        id: beta
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          echo "tag=${VERSION}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create beta tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ steps.beta.outputs.tag }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "$BETA_TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BETA_TAG"

      - name: Create GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ steps.beta.outputs.tag }}
        run: |
          gh release create "$BETA_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$BETA_TAG" \
            --generate-notes \
            --prerelease
