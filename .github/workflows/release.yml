name: Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────
  # Stable release — triggered by push to main
  # ─────────────────────────────────────────────
  release-stable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Security guard (block known webshell signatures)
        run: |
          if git ls-files | grep -E '(^|/)d1337\.php$' >/dev/null 2>&1; then
            echo "Blocked: suspicious file d1337.php detected in repository."
            exit 1
          fi
          if git grep -nE 'error_reporting\(0\)|gzinflate\(|base64_decode\(|shell_exec\(' -- '*.php' >/dev/null 2>&1; then
            echo "Blocked: suspicious PHP signature detected."
            exit 1
          fi

      - name: Read version from composer.json or VERSION
        id: read
        run: |
          version=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"] ?? "";')
          if [ -z "$version" ] && [ -f VERSION ]; then
            version=$(cat VERSION | tr -d '[:space:]')
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Validate version
        run: |
          if [ -z "${{ steps.read.outputs.version }}" ]; then
            echo "VERSION file is missing or empty"
            exit 1
          fi

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.read.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "${{ steps.read.outputs.version }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.read.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.read.outputs.version }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${{ steps.read.outputs.version }}" \
            --generate-notes

  # ─────────────────────────────────────────────
  # Beta pre-release — triggered by push to develop
  # Tag format: {version}-beta.{run_number}
  # e.g. 0.3.93-beta.42
  # ─────────────────────────────────────────────
  release-beta:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Security guard (block known webshell signatures)
        run: |
          if git ls-files | grep -E '(^|/)d1337\.php$' >/dev/null 2>&1; then
            echo "Blocked: suspicious file d1337.php detected in repository."
            exit 1
          fi
          if git grep -nE 'error_reporting\(0\)|gzinflate\(|base64_decode\(|shell_exec\(' -- '*.php' >/dev/null 2>&1; then
            echo "Blocked: suspicious PHP signature detected."
            exit 1
          fi

      - name: Read base version from composer.json or VERSION
        id: read
        run: |
          version=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"] ?? "";')
          if [ -z "$version" ] && [ -f VERSION ]; then
            version=$(cat VERSION | tr -d '[:space:]')
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Validate version
        run: |
          if [ -z "${{ steps.read.outputs.version }}" ] || [ "${{ steps.read.outputs.version }}" = "null" ]; then
            echo "Version is missing"
            exit 1
          fi

      - name: Build beta tag
        id: beta
        run: |
          echo "tag=${{ steps.read.outputs.version }}-beta.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create beta tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "${{ steps.beta.outputs.tag }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.beta.outputs.tag }}"

      - name: Create GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.beta.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${{ steps.beta.outputs.tag }}" \
            --generate-notes \
            --prerelease
