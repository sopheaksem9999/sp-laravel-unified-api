name: Release

# Runs only after the Security workflow completes on main or develop.
# If any security check failed, both release jobs are skipped automatically.
on:
  workflow_run:
    workflows: ["Security"]
    types:
      - completed
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────
  # Stable release — triggered by push to main
  # ─────────────────────────────────────────────
  release-stable:
    # Only run when security passed, pushed to canonical repo (not a fork), and branch was main
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          # Check out canonical main branch verified by security workflow
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Read version from composer.json or VERSION
        id: read
        run: |
          set -euo pipefail
          version=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"] ?? "";')
          if [ -z "$version" ] && [ -f VERSION ]; then
            version=$(cat VERSION | tr -d '[:space:]')
          fi
          # Strict semver X.Y.Z — rejects any string containing shell metacharacters
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid or missing version: '$version'. Must be semver (e.g. 1.2.3)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "$VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$VERSION"

      - name: Extract release notes from CHANGELOG.md
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          php -r '
            $version = $argv[1];
            $content = file_exists("CHANGELOG.md") ? file_get_contents("CHANGELOG.md") : "";
            if (preg_match("/##\s*\[\s*" . preg_quote($version, "/") . "\s*\][^\n]*\n(.*?)(?=\n##\s*\[|\z)/s", $content, $matches)) {
                file_put_contents("release-notes.md", trim($matches[1]));
            } else {
                file_put_contents("release-notes.md", "Release notes for version {$version}");
            }
          ' "$VERSION"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --generate-notes

  # ─────────────────────────────────────────────
  # Beta pre-release — triggered by push to develop
  # Tag format: {version}-beta.{run_number}
  # e.g. 0.3.93-beta.42
  # ─────────────────────────────────────────────
  release-beta:
    # Only run when security passed, pushed to canonical repo (not a fork), and branch was develop
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          # Check out canonical develop branch verified by security workflow
          ref: develop
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check if version changed in this commit
        id: version_check
        run: |
          set -euo pipefail
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -qE '^(VERSION|composer\.json)$'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Version files changed: creating beta release."
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Version files unchanged: skipping beta release."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read base version from composer.json or VERSION
        if: steps.version_check.outputs.changed == 'true'
        id: read
        run: |
          set -euo pipefail
          version=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"] ?? "";')
          if [ -z "$version" ] && [ -f VERSION ]; then
            version=$(cat VERSION | tr -d '[:space:]')
          fi
          # Strict semver X.Y.Z — rejects any string containing shell metacharacters
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid or missing version: '$version'. Must be semver (e.g. 1.2.3)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build beta tag
        if: steps.version_check.outputs.changed == 'true'
        id: beta
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          echo "tag=${VERSION}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create beta tag
        if: steps.version_check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ steps.beta.outputs.tag }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "$BETA_TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BETA_TAG"

      - name: Extract release notes from CHANGELOG.md
        if: steps.version_check.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          php -r '
            $version = $argv[1];
            $content = file_exists("CHANGELOG.md") ? file_get_contents("CHANGELOG.md") : "";
            if (preg_match("/##\s*\[\s*" . preg_quote($version, "/") . "\s*\][^\n]*\n(.*?)(?=\n##\s*\[|\z)/s", $content, $matches)) {
                file_put_contents("beta-notes.md", trim($matches[1]));
            } else {
                file_put_contents("beta-notes.md", "Beta pre-release for version {$version}");
            }
          ' "$VERSION"

      - name: Create GitHub Pre-Release
        if: steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ steps.beta.outputs.tag }}
        run: |
          gh release create "$BETA_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$BETA_TAG" \
            --notes-file beta-notes.md \
            --generate-notes \
            --prerelease
